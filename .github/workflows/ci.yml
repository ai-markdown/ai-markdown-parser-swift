name: Parser validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate-parser.py --check
      - run: python3 scripts/test-generate-parser.py
      - run: python3 scripts/sync-upstream-tests.py --check
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift test -c release
  rebuild:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --checkout
      - run: python3 scripts/generate-parser.py --check --rebuild-check
      - run: python3 scripts/sync-upstream-tests.py --check --rebuild-check
